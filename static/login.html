<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>RoboChat register</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://cdn.socket.io/4.5.3/socket.io.min.js"
        integrity="sha384-WPFUvHkB1aHA5TDSZi6xtDgkF0wXJcIIxXhC6h8OT8EH3fC5PWro5pWJ1THjcfEi"
        crossorigin="anonymous"></script>
    <script src="auth.js" defer></script>
</head>

<body>
    <main>
        <h1 class="header">RoboChat</h1>

        <form class="register-form" id="login-form">
            <div class="register-form__container">
                <label for="login" class="register-form__label">Login</label>
                <input type="text" id="login" name="login" class="register-form__input" placeholder="">

                <label for="password" class="register-form__label">Password</label>
                <input type="text" id="password" name="password" class="register-form__input" placeholder="">

                <button type="submit" class="register-form__button">Submit</button>
            </div>
        </form>
    </main>
</body>

</html>
